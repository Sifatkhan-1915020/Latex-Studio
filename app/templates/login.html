{% extends "base.html" %}

{% block title %}Sign In - Overleaf LaTeX Studio{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.12), transparent 40%), radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.08), transparent 40%), var(--bg-primary);">
  
  <div class="glass-card" style="width: 100%; max-width: 440px; padding: 40px; position: relative;">
    
    <!-- Brand Header -->
    <div style="text-align: center; margin-bottom: 32px;">
      <div style="width: 52px; height: 52px; border-radius: var(--radius-lg); background: linear-gradient(135deg, #10b981 0%, #059669 100%); display: inline-flex; align-items: center; justify-content: center; color: white; margin-bottom: 16px; box-shadow: 0 8px 20px var(--accent-emerald-glow);">
        <i data-lucide="edit-3" style="width: 28px; height: 28px;"></i>
      </div>
      <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 6px;">Welcome Back</h1>
      <p style="color: var(--text-secondary); font-size: 13.5px;">Sign in to your local LaTeX workspace</p>
    </div>

    <!-- Login Form -->
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username_or_email">Username or Email</label>
        <div style="position: relative;">
          <input type="text" id="username_or_email" name="username_or_email" class="form-input" placeholder="e.g. scientist or user@example.com" required autofocus style="padding-left: 38px;">
          <i data-lucide="user" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label class="form-label" for="password">Password</label>
        </div>
        <div style="position: relative;">
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required style="padding-left: 38px;">
          <i data-lucide="lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 12px;">
        <i data-lucide="log-in" style="width: 18px; height: 18px;"></i> Sign In
      </button>
    </form>

    <!-- Footer Links -->
    <div style="margin-top: 28px; text-align: center; font-size: 13px; color: var(--text-secondary);">
      Don't have an account? 
      <a href="/register" style="font-weight: 600; color: var(--accent-emerald-light);">Create Account</a>
    </div>

  </div>
</div>
{% endblock %}
