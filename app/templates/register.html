{% extends "base.html" %}

{% block title %}Sign Up - Overleaf LaTeX Studio{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(circle at top left, rgba(16, 185, 129, 0.12), transparent 40%), radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.08), transparent 40%), var(--bg-primary);">
  
  <div class="glass-card" style="width: 100%; max-width: 460px; padding: 40px; position: relative;">
    
    <!-- Brand Header -->
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width: 52px; height: 52px; border-radius: var(--radius-lg); background: linear-gradient(135deg, #10b981 0%, #059669 100%); display: inline-flex; align-items: center; justify-content: center; color: white; margin-bottom: 16px; box-shadow: 0 8px 20px var(--accent-emerald-glow);">
        <i data-lucide="sparkles" style="width: 28px; height: 28px;"></i>
      </div>
      <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 6px;">Create an Account</h1>
      <p style="color: var(--text-secondary); font-size: 13.5px;">Setup your private local LaTeX workspace</p>
    </div>

    <!-- Registration Form -->
    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div style="position: relative;">
          <input type="text" id="username" name="username" class="form-input" placeholder="e.g. johndoe" required autofocus style="padding-left: 38px;">
          <i data-lucide="user" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div style="position: relative;">
          <input type="email" id="email" name="email" class="form-input" placeholder="john@example.com" required style="padding-left: 38px;">
          <i data-lucide="mail" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="full_name">Full Name (Optional)</label>
        <div style="position: relative;">
          <input type="text" id="full_name" name="full_name" class="form-input" placeholder="Dr. John Doe" style="padding-left: 38px;">
          <i data-lucide="user-check" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div style="position: relative;">
          <input type="password" id="password" name="password" class="form-input" placeholder="At least 6 characters" minlength="6" required style="padding-left: 38px;">
          <i data-lucide="lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <div style="position: relative;">
          <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Re-enter password" minlength="6" required style="padding-left: 38px;">
          <i data-lucide="shield-check" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 12px;">
        <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i> Get Started
      </button>
    </form>

    <!-- Footer Links -->
    <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-secondary);">
      Already have an account? 
      <a href="/login" style="font-weight: 600; color: var(--accent-emerald-light);">Sign In</a>
    </div>

  </div>
</div>
{% endblock %}
