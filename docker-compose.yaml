services:
  overleaf-latex-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: overleaf-latex-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=overleaf-super-secret-production-jwt-key-987654321
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent SQLite database and user project workspaces
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
